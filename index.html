<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Placement 5-Star Mastery Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .accordion-content {
            transition: max-height 0.3s ease-out;
            max-height: 0;
            overflow: hidden;
        }
        .accordion-content.expanded {
            max-height: 2000px; /* arbitrary large max-height */
        }
        .tab-btn.active {
            border-bottom: 2px solid #ef4444; /* red-500 */
            color: #ef4444;
        }
        .completed-row {
            background-color: #f0fdf4; /* green-50 */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">🚀 Pre-Placement 5-Star Mastery Tracker</h1>
            <p class="text-gray-600">The ultimate A-to-Z checklist for your 6-month preparation.</p>
            
            <!-- Overall Progress -->
            <div class="mt-6 max-w-2xl mx-auto bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <div class="flex justify-between text-sm font-medium mb-1">
                    <span>Overall Progress</span>
                    <span id="overall-progress-text">0% (0 / 0)</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="overall-progress-bar" class="bg-red-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Domain Tabs -->
        <div class="bg-white rounded-t-lg shadow-sm border-b border-gray-200 overflow-x-auto">
            <div id="tabs-container" class="flex whitespace-nowrap px-2 pt-2">
                <!-- Tabs rendered by JS -->
            </div>
        </div>

        <!-- Content Area -->
        <div id="content-container" class="bg-white shadow-sm rounded-b-lg border border-t-0 border-gray-200 p-6 min-h-[500px]">
            <!-- Accordions rendered by JS -->
        </div>

    </div>

    <!-- Data and App Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
